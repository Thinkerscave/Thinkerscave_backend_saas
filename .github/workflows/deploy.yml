name: Deploy Backend

on:
  push:
    branches: [master]

env:
  IMAGE: ghcr.io/thinkerscave/thinkerscave-backend

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: read

    steps:
      - name: Pull & restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Free disk + clear broken containerd ingest leftovers (common pull rename failures)
            df -h / /var/lib/docker /var/lib/containerd 2>/dev/null || df -h /
            docker system prune -af || true
            sudo rm -rf /var/lib/containerd/io.containerd.content.v1.content/ingest/* 2>/dev/null || true
            sudo rm -rf /var/lib/docker/containerd/daemon/io.containerd.content.v1.content/ingest/* 2>/dev/null || true

            pull_image() {
              docker pull "$IMAGE:latest"
            }

            if ! pull_image; then
              echo "First pull failed — cleaning ingest cache and retrying..."
              sudo rm -rf /var/lib/containerd/io.containerd.content.v1.content/ingest/* 2>/dev/null || true
              sudo rm -rf /var/lib/docker/containerd/daemon/io.containerd.content.v1.content/ingest/* 2>/dev/null || true
              docker system prune -af || true
              pull_image
            fi

            docker stop thinkerscave-backend || true
            docker rm   thinkerscave-backend || true

            # `docker system prune` above can drop the shared network when nothing is attached
            docker network inspect web >/dev/null 2>&1 || docker network create web

            # Not published to the host: reachable only by the frontend container over the "web" network.
            docker run -d \
              --name thinkerscave-backend \
              --restart unless-stopped \
              --network web \
              --env-file /opt/thinkerscave/.env \
              -e SPRING_PROFILES_ACTIVE=prod \
              -v /var/thinkerscave/uploads:/var/thinkerscave/uploads \
              -v /var/thinkerscave/logs:/app/Logs \
              "$IMAGE:latest"

            # Fail the deploy (instead of reporting success) if the app does not start.
            echo "Waiting for backend health..."
            for i in $(seq 1 40); do
              status=$(docker inspect -f '{{.State.Health.Status}}' thinkerscave-backend 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              if [ "$i" -eq 40 ] || [ "$(docker inspect -f '{{.State.Running}}' thinkerscave-backend 2>/dev/null)" != "true" ]; then
                echo "Backend failed to become healthy (status: $status)"
                docker logs --tail 100 thinkerscave-backend
                exit 1
              fi
              sleep 5
            done

            docker image prune -f
            echo "Backend deployed: $IMAGE:latest"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}

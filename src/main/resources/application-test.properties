# =============================================================================
# TEST — shared deploy space (same DB/settings as dev/prod for now)
# Activate: --spring.profiles.active=test   OR   SPRING_PROFILES_ACTIVE=test
# =============================================================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://72.61.244.175:5435/thinkerscave_db?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:thinkerscave}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cP7_min30Xt17DpFYuE8}

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# DB is prepared outside the app — do not auto-create/update/seed
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

app.multi-tenancy.enabled=true
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
app.tenancy.schema-switcher=${TENANCY_SCHEMA_SWITCHER:postgresql}
app.tenancy.platform-schema=${TENANCY_PLATFORM_SCHEMA:public}

spring.sql.init.mode=never
spring.flyway.enabled=${PUBLIC_FLYWAY_ENABLED:false}
spring.flyway.default-schema=${TENANCY_PLATFORM_SCHEMA:public}
spring.flyway.schemas=${TENANCY_PLATFORM_SCHEMA:public}

logging.level.root=INFO
logging.level.com.thinkerscave=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

jwt.secret=${JWT_SECRET:ThinkersCave-TestServer-JWT-Secret-Key-Min32Chars-2026!}
jwt.expiration=${JWT_EXPIRATION:3600000}
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:86400000}
refresh.token.remember-me-expiration=${REFRESH_TOKEN_REMEMBER_ME_EXPIRATION:2592000000}

app.auth.refresh-cookie.enabled=true
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie.domain=${REFRESH_COOKIE_DOMAIN:}
app.auth.refresh-cookie.remember-me-max-age-seconds=${REFRESH_COOKIE_REMEMBER_ME_MAX_AGE:2592000}
app.auth.password-reset.log-otp=${PASSWORD_RESET_LOG_OTP:true}

app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
management.health.mail.enabled=false
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}
app.notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:true}
app.notification.sms.provider=${SMS_PROVIDER:log}
app.notification.sms.api-key=${SMS_API_KEY:textbelt}

app.upload.base-dir=${UPLOAD_BASE_DIR:/var/thinkerscave/uploads}

server.port=${SERVER_PORT:8080}

app.security.auth-rate-limit.enabled=true
app.security.auth-rate-limit.max-requests=60
app.security.auth-rate-limit.window-seconds=60
app.security.lockout.max-failed-attempts=5
app.security.lockout.retry-delay-ms=500

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.access.development-reset-password=Password@123

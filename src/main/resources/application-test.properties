# =============================================================================
# TEST — testing / shared server (PostgreSQL)
# Activate: --spring.profiles.active=test   OR   SPRING_PROFILES_ACTIVE=test
# =============================================================================

# --- Database: remote PostgreSQL ---
# Use Spring Boot standard overrides only:
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# Do NOT use legacy DB_USERNAME/DB_PASSWORD (those poison local MySQL leftovers).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://72.61.244.175:5435/thinkerscave_db?options=-c%20TimeZone%3DUTC
spring.datasource.username=thinkerscave
spring.datasource.password=cP7_min30Xt17DpFYuE8

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

# --- Multi-tenancy (PostgreSQL schemas) ---
app.multi-tenancy.enabled=true
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
app.tenancy.schema-switcher=${TENANCY_SCHEMA_SWITCHER:postgresql}
app.tenancy.platform-schema=${TENANCY_PLATFORM_SCHEMA:public}

spring.sql.init.mode=never
spring.flyway.enabled=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.thinkerscave=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# --- JWT ---
jwt.secret=${JWT_SECRET:ThinkersCave-TestServer-JWT-Secret-Key-Min32Chars-2026!}
jwt.expiration=${JWT_EXPIRATION:3600000}
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:86400000}

app.auth.refresh-cookie.enabled=true
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie.domain=${REFRESH_COOKIE_DOMAIN:}

# CORS — open for now (DevOps can tighten via ALLOWED_ORIGINS)
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# --- Mail ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
management.health.mail.enabled=false

# --- Uploads ---
app.upload.base-dir=${UPLOAD_BASE_DIR:/var/thinkerscave/uploads}

# --- Server (matches http://72.61.244.175:8080) ---
server.port=${SERVER_PORT:8080}

app.security.auth-rate-limit.enabled=true
app.security.auth-rate-limit.max-requests=60
app.security.auth-rate-limit.window-seconds=60
app.security.lockout.max-failed-attempts=5
app.security.lockout.retry-delay-ms=500

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

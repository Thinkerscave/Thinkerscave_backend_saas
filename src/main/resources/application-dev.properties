# =============================================================================
# Development Environment Configuration - MySQL Local Database
# =============================================================================

# --- Database: MySQL local ---
spring.datasource.url=jdbc:mysql://localhost:3306/thinkerscave_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
# MySQLDialect is auto-detected from the MySQL driver — no need to specify explicitly
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25

# --- Schema + Data SQL initialization ---
# DevDataInitializer loads db/dev/data.sql after Hibernate creates entity tables.
spring.sql.init.mode=never

# --- Multi-Tenancy ---
# Enabled so each logged-in user sees only their own organization's data.
# In dev/MySQL mode this uses row-level organization_id filtering (no separate schemas).
# Tenant MySQL databases (tenant_jsb_bhubaneswar, etc.) are created on startup for production parity.
# Login as (password Password@123) — select matching org on /auth/select-organization first:
#   superadmin / javier.* (org 1 JSB) / jsc.* (org 2) / abc.* (org 3) / kalinga.* (org 4)
app.multi-tenancy.enabled=true

# --- Flyway: DISABLED for dev (uses Hibernate DDL + DevDataInitializer instead) ---
spring.flyway.enabled=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.thinkerscave=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc=DEBUG

# --- JWT ---
jwt.secret=ZGV2X3NlY3JldF9rZXlfbWluaW11bV8yNTZfYml0c19mb3JfSFMyNTYh
jwt.expiration=3600000
refresh.token.expiration=86400000

# --- Mail: Disabled for development ---
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=dev@thinkerscave.local
spring.mail.password=devpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Server ---
server.port=${SERVER_PORT:8181}

# --- CORS (Angular dev server - supports multiple ports) ---
app.cors.allowed-origins=http://localhost:4200,http://localhost:4300,http://127.0.0.1:4200
# ============================================
# Development Environment - H2 Database
# ============================================

# H2 In-Memory Database (accessible via browser console)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:thinkerscave_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (http://localhost:8181/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate - Auto-create tables from entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Load seed data AFTER Hibernate creates tables (handled by DevDataInitializer)
spring.sql.init.mode=never

# Multi-Tenancy - DISABLED for dev (single schema mode)
app.multi-tenancy.enabled=false
spring.jpa.properties.hibernate.multiTenancy=NONE

# Logging - Verbose for development
logging.level.root=INFO
logging.level.com.thinkerscave=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.jdbc=DEBUG

# JWT - Dev secret (safe for local only)
jwt.secret=ZGV2U2VjcmV0S2V5TWluaW11bTI1NkJpdHNGb3JIUzI1NkFsZ29yaXRobVRlc3Rpbmc=
jwt.expiration=3600000
refresh.token.expiration=86400000

# Mail - Disable in dev (use log instead)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=dummy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=8181

# Dev tools
spring.devtools.restart.enabled=true
# =============================================================================
# Development Environment Configuration - H2 In-Memory Database
# =============================================================================

# --- Database: H2 in-memory with PostgreSQL compatibility mode ---
# All tables live in the PUBLIC schema. No separate tenant schema needed in dev.
# Multi-tenancy is simulated via organization_id filtering.
spring.datasource.url=jdbc:h2:mem:thinkerscave_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- H2 Console (for visual inspection during dev) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Dialect is set by HibernateMultiTenantConfig based on app.multi-tenancy.enabled
spring.jpa.defer-datasource-initialization=true

# --- Schema + Data SQL initialization ---
# DevDataInitializer loads db/dev/data.sql after Hibernate creates entity tables.
spring.sql.init.mode=never

# --- Multi-Tenancy ---
app.multi-tenancy.enabled=false

# --- Flyway: DISABLED for dev (uses Hibernate DDL + DevDataInitializer instead) ---
spring.flyway.enabled=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.thinkerscave=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc=DEBUG

# --- JWT ---
jwt.secret=ZGV2X3NlY3JldF9rZXlfbWluaW11bV8yNTZfYml0c19mb3JfSFMyNTYh
jwt.expiration=3600000
refresh.token.expiration=86400000

# --- Mail: Disabled for development ---
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=dev@thinkerscave.local
spring.mail.password=devpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Server ---
server.port=8181

# --- CORS (Angular dev server - supports multiple ports) ---
app.cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4300,http://127.0.0.1:4200,http://127.0.0.1:4300,http://localhost:3000
# =============================================================================
# DEV profile — deployed server (remote PostgreSQL)
# Activate: --spring.profiles.active=dev   OR   SPRING_PROFILES_ACTIVE=dev
# Seed / SQL init / verbose Hibernate SQL: OFF
# =============================================================================

# --- Database: remote PostgreSQL ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://72.61.244.175:5435/thinkerscave_db?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${DB_USERNAME:thinkerscave}
spring.datasource.password=${DB_PASSWORD:cP7_min30Xt17DpFYuE8}

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
# update = auto-create/alter tables on empty remote DEV DB
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

# --- Schema-per-tenant (PostgreSQL) ---
app.multi-tenancy.enabled=true
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
app.tenancy.schema-switcher=${TENANCY_SCHEMA_SWITCHER:postgresql}
app.tenancy.platform-schema=${TENANCY_PLATFORM_SCHEMA:public}

# --- Init / Flyway ---
# PlatformBootstrapSeed (@Profile("dev")) inserts Super Admin when DB is empty.
spring.sql.init.mode=never
spring.flyway.enabled=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.thinkerscave=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# --- JWT ---
jwt.secret=${JWT_SECRET:ThinkersCave-DevServer-JWT-Secret-Key-ChangeInProd-Min32Chars!}
jwt.expiration=${JWT_EXPIRATION:3600000}
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:86400000}

# Refresh cookie (HTTP IP host — Secure=false for now)
app.auth.refresh-cookie.enabled=true
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie.domain=${REFRESH_COOKIE_DOMAIN:}

# CORS — local Angular + server UI hosts
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4300,http://localhost:4200,http://72.61.244.175,http://72.61.244.175:80,http://72.61.244.175:4300}

# --- Mail (disabled unless env provided) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
management.health.mail.enabled=false

# --- Server ---
# Remote deploy default 8080; local run against DEV DB: SERVER_PORT=8181
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

# Auth hardening — production-like on server
app.security.auth-rate-limit.enabled=true
app.security.auth-rate-limit.max-requests=40
app.security.auth-rate-limit.window-seconds=60
app.security.lockout.max-failed-attempts=5
app.security.lockout.retry-delay-ms=500

# OpenAPI stays available on non-prod profiles (!prod)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

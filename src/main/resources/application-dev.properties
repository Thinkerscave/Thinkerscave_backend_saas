# =============================================================================
# Development Environment Configuration - MySQL Local Database
# =============================================================================

# --- Database: MySQL local ---
spring.datasource.url=jdbc:mysql://localhost:3306/thinkerscave_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
# MySQLDialect is auto-detected from the MySQL driver — no need to specify explicitly
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25

# --- Schema + Data SQL initialization ---
# DevDataInitializer loads db/dev/data.sql after Hibernate creates entity tables.
spring.sql.init.mode=never

# --- Multi-Tenancy ---
# DATABASE strategy: each tenant gets its own MySQL database (catalog).
app.multi-tenancy.enabled=true
spring.jpa.properties.hibernate.multiTenancy=DATABASE
app.tenancy.schema-switcher=mysql
app.tenancy.platform-schema=${TENANCY_PLATFORM_SCHEMA:thinkerscave_dev}

# --- Flyway: DISABLED for local MySQL workflow (enable when aligning schemas) ---
spring.flyway.enabled=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.thinkerscave=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

# --- JWT (local only — set JWT_SECRET in .env; no committed secret) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
refresh.token.expiration=86400000

# Refresh cookie for local Angular (localhost:4300 → localhost:8181)
app.auth.refresh-cookie.enabled=true
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax
app.auth.refresh-cookie.domain=

# --- Mail: Disabled for development ---
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=dev@thinkerscave.local
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Local SMTP is usually not running — keep actuator healthy without mail.
management.health.mail.enabled=false

# --- Server ---
server.port=${SERVER_PORT:8181}
server.shutdown=graceful

# Auth hardening — keep enabled but generous for local UI testing
app.security.auth-rate-limit.enabled=true
app.security.auth-rate-limit.max-requests=200
app.security.auth-rate-limit.window-seconds=60
app.security.lockout.max-failed-attempts=20
app.security.lockout.retry-delay-ms=100

# =============================================================================
# DEV — local development ONLY (localhost MySQL + local ports)
# Activate: --spring.profiles.active=dev
# =============================================================================

# --- Database: MySQL local ---
spring.datasource.url=jdbc:mysql://localhost:3306/thinkerscave_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25

spring.sql.init.mode=never
spring.flyway.enabled=false

# --- Multi-tenancy (MySQL catalog) ---
app.multi-tenancy.enabled=true
spring.jpa.properties.hibernate.multiTenancy=DATABASE
app.tenancy.schema-switcher=mysql
app.tenancy.platform-schema=${TENANCY_PLATFORM_SCHEMA:thinkerscave_dev}

# --- Logging ---
logging.level.root=INFO
logging.level.com.thinkerscave=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

# --- JWT ---
jwt.secret=${JWT_SECRET:ThinkersCave-LocalDev-JWT-Secret-Key-Min32Chars!}
jwt.expiration=3600000
refresh.token.expiration=86400000
refresh.token.remember-me-expiration=2592000000

# Refresh cookie — localhost Angular :4300 → backend :8181
app.auth.refresh-cookie.enabled=true
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax
app.auth.refresh-cookie.domain=
app.auth.refresh-cookie.remember-me-max-age-seconds=2592000
app.auth.password-reset.log-otp=true

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:3000,*}

# --- Mail (FREE: set MAIL_* to Gmail App Password — see .env.example) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
management.health.mail.enabled=false
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.notification.email.enabled=true
app.notification.sms.enabled=true
app.notification.sms.provider=${SMS_PROVIDER:log}
app.notification.sms.api-key=${SMS_API_KEY:textbelt}

# --- Uploads ---
app.upload.base-dir=${UPLOAD_BASE_DIR:uploads}

# --- Server ---
server.port=${SERVER_PORT:8181}

app.security.auth-rate-limit.enabled=true
app.security.auth-rate-limit.max-requests=200
app.security.auth-rate-limit.window-seconds=60
app.security.lockout.max-failed-attempts=20
app.security.lockout.retry-delay-ms=100

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

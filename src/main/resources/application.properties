# Profiles: dev | test | prod — same shared PostgreSQL deploy space for now.
# DB is never auto-seeded: prepare schema/master data outside the app
# (see scripts/postgres/README.md). Split datasources later via SPRING_DATASOURCE_*.
# Activate via OS env or CLI only. Local .env files are NOT imported.
# Example: --spring.profiles.active=prod   OR   SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=test

# Server port (profiles may override)
server.port=8181
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JWT — each profile supplies a default; OS env JWT_SECRET still wins when set
jwt.secret=
jwt.expiration=900000
refresh.token.expiration=86400000
# 30 days when "Remember this device" is checked
refresh.token.remember-me-expiration=2592000000

# Refresh token HttpOnly cookie
app.auth.refresh-cookie.enabled=true
app.auth.refresh-cookie.name=tc_refresh_token
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.max-age-seconds=86400
app.auth.refresh-cookie.remember-me-max-age-seconds=2592000
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax
app.auth.refresh-cookie.domain=

# Log OTP in server logs when SMTP is unavailable (enable for local/dev)
app.auth.password-reset.log-otp=false

# --- Free notifications (email + SMS) ---
# Email: set MAIL_* to Gmail SMTP (free). SMS default is log (free).
app.notification.email.enabled=true
app.notification.sms.enabled=true
app.notification.sms.provider=log
app.notification.sms.api-key=textbelt
app.notification.sms.default-country-code=91
app.notification.sms.sender=ThinkersCave
app.mail.from=

# Mail defaults (override with Gmail — see .env.example)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Auth hardening
app.security.lockout.max-failed-attempts=5
app.security.lockout.retry-delay-ms=500
app.security.auth-rate-limit.enabled=true
app.security.auth-rate-limit.max-requests=20
app.security.auth-rate-limit.window-seconds=60

# --- Centralized archival / data retention ---
# Each registered retention task purges rows older than its configured window.
# Add/override datasets under app.retention.tasks.<TASK_KEY>.
app.retention.enabled=true
app.retention.cron=0 30 2 * * *
app.retention.tasks.LOGIN_HISTORY.retention-days=30
app.retention.tasks.LOGIN_HISTORY.enabled=true

# Tenancy defaults (overridden per profile)
app.multi-tenancy.enabled=true
app.tenancy.schema-switcher=mysql
app.tenancy.platform-schema=thinkerscave_dev
app.tenancy.platform-organization-id=249

# Startup Flyway is public/control-plane only. Tenant migrations are always
# programmatic and use db/migration/tenant with an isolated history table.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/public
spring.flyway.default-schema=thinkerscave_dev
spring.flyway.schemas=thinkerscave_dev
spring.flyway.table=flyway_public_schema_history
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Uploads
app.upload.base-dir=uploads
app.upload.max-file-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# CORS default (profiles override; * allowed via Origin patterns)
app.cors.allowed-origins=*

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Encoding / timezone (JVM should also use -Duser.timezone=UTC)
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Logging defaults
logging.file.name=Logs/application.log
logging.level.root=INFO
logging.level.com.thinkerscave=INFO
logging.level.org.springframework.security=WARN

# Canonical list pagination (0-based page, size query params)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

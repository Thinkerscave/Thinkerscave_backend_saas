# Profiles: dev (local MySQL) | test (shared server) | prod (production)
# Activate via OS env or CLI only. Local .env files are NOT imported.
# Example: --spring.profiles.active=prod   OR   SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=test

# Server port (profiles may override)
server.port=${SERVER_PORT:8181}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JWT — each profile supplies a default; OS env JWT_SECRET still wins when set
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:900000}
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:86400000}

# Refresh token HttpOnly cookie
app.auth.refresh-cookie.enabled=${REFRESH_COOKIE_ENABLED:true}
app.auth.refresh-cookie.name=tc_refresh_token
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.max-age-seconds=${REFRESH_COOKIE_MAX_AGE:86400}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie.domain=${REFRESH_COOKIE_DOMAIN:}

# Auth hardening
app.security.lockout.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.security.lockout.retry-delay-ms=${AUTH_RETRY_DELAY_MS:500}
app.security.auth-rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.security.auth-rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX:20}
app.security.auth-rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

# Tenancy defaults (overridden per profile)
app.multi-tenancy.enabled=true
app.tenancy.schema-switcher=${TENANCY_SCHEMA_SWITCHER:mysql}
app.tenancy.platform-schema=${TENANCY_PLATFORM_SCHEMA:thinkerscave_dev}

# Uploads
app.upload.base-dir=${UPLOAD_BASE_DIR:uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# CORS default (profiles override; * allowed via Origin patterns)
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Encoding / timezone (JVM should also use -Duser.timezone=UTC)
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Logging defaults
logging.file.name=Logs/application.log
logging.level.root=INFO
logging.level.com.thinkerscave=INFO
logging.level.org.springframework.security=WARN

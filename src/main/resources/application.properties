# Default profile: dev (override with --spring.profiles.active=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server port
server.port=${SERVER_PORT:8181}

# JWT Configuration
jwt.secret=${JWT_SECRET:dev_secret_key_minimum_256_bits_for_HS256_algorithm_testing_only_do_not_use_in_production}
jwt.expiration=${JWT_EXPIRATION:900000}
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:86400000}

# Logging
logging.file.name=target/app.log
logging.level.org.springframework.security=DEBUG
logging.level.com.thinkerscave=DEBUG

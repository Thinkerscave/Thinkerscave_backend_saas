# Profiles: dev (local MySQL) | test (shared server) | prod (production)
# Activate via OS env or CLI only. Local .env files are NOT imported.
# Example: --spring.profiles.active=prod   OR   SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=test

# Server port (profiles may override)
server.port=${SERVER_PORT:8181}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JWT — each profile supplies a default; OS env JWT_SECRET still wins when set
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:900000}
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:86400000}
# 30 days when "Remember this device" is checked
refresh.token.remember-me-expiration=${REFRESH_TOKEN_REMEMBER_ME_EXPIRATION:2592000000}

# Refresh token HttpOnly cookie
app.auth.refresh-cookie.enabled=${REFRESH_COOKIE_ENABLED:true}
app.auth.refresh-cookie.name=tc_refresh_token
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.max-age-seconds=${REFRESH_COOKIE_MAX_AGE:86400}
app.auth.refresh-cookie.remember-me-max-age-seconds=${REFRESH_COOKIE_REMEMBER_ME_MAX_AGE:2592000}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie.domain=${REFRESH_COOKIE_DOMAIN:}

# Log OTP in server logs when SMTP is unavailable (enable for local/dev)
app.auth.password-reset.log-otp=${PASSWORD_RESET_LOG_OTP:false}

# --- Free notifications (email + SMS) ---
# Email: set MAIL_* to Gmail SMTP (free). SMS default is log (free).
app.notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}
app.notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:true}
app.notification.sms.provider=${SMS_PROVIDER:log}
app.notification.sms.api-key=${SMS_API_KEY:textbelt}
app.notification.sms.default-country-code=${SMS_DEFAULT_COUNTRY_CODE:91}
app.notification.sms.sender=${SMS_SENDER:ThinkersCave}
app.mail.from=${MAIL_FROM:}

# Mail defaults (override with Gmail — see .env.example)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Auth hardening
app.security.lockout.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.security.lockout.retry-delay-ms=${AUTH_RETRY_DELAY_MS:500}
app.security.auth-rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.security.auth-rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX:20}
app.security.auth-rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

# Tenancy defaults (overridden per profile)
app.multi-tenancy.enabled=true
app.tenancy.schema-switcher=${TENANCY_SCHEMA_SWITCHER:mysql}
app.tenancy.platform-schema=${TENANCY_PLATFORM_SCHEMA:thinkerscave_dev}

# Uploads
app.upload.base-dir=${UPLOAD_BASE_DIR:uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# CORS default (profiles override; * allowed via Origin patterns)
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Encoding / timezone (JVM should also use -Duser.timezone=UTC)
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Logging defaults
logging.file.name=Logs/application.log
logging.level.root=INFO
logging.level.com.thinkerscave=INFO
logging.level.org.springframework.security=WARN

# =============================================================================
# PROD — production deploy (same shared server credentials for now)
# Activate: --spring.profiles.active=prod   OR   SPRING_PROFILES_ACTIVE=prod
# DevOps: no code changes required — select this profile and start the JAR.
# =============================================================================

# --- Database: remote PostgreSQL ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://72.61.244.175:5435/thinkerscave_db?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${DB_USERNAME:thinkerscave}
spring.datasource.password=${DB_PASSWORD:cP7_min30Xt17DpFYuE8}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA ---
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

# --- Multi-tenancy (PostgreSQL schemas) ---
app.multi-tenancy.enabled=true
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
app.tenancy.schema-switcher=${TENANCY_SCHEMA_SWITCHER:postgresql}
app.tenancy.platform-schema=${TENANCY_PLATFORM_SCHEMA:public}

spring.sql.init.mode=never
# Flyway off until migrations match current JPA schema end-to-end
spring.flyway.enabled=false

# --- Logging ---
logging.level.root=WARN
logging.level.com.thinkerscave=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# --- JWT (override JWT_SECRET in OS env for stronger production secret) ---
jwt.secret=${JWT_SECRET:ThinkersCave-ProdServer-JWT-Secret-Key-Min32Chars-2026!}
jwt.expiration=${JWT_EXPIRATION:3600000}
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:86400000}

app.auth.refresh-cookie.enabled=${REFRESH_COOKIE_ENABLED:true}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.auth.refresh-cookie.domain=${REFRESH_COOKIE_DOMAIN:}

# CORS — open for current HTTP IP deploy; tighten later via ALLOWED_ORIGINS
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# --- Mail ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
management.health.mail.enabled=false

# --- Uploads ---
app.upload.base-dir=${UPLOAD_BASE_DIR:/var/thinkerscave/uploads}

# --- Server ---
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

server.error.include-message=never
server.error.include-stacktrace=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.security.auth-rate-limit.enabled=true
app.security.auth-rate-limit.max-requests=40
app.security.auth-rate-limit.window-seconds=60
app.security.lockout.max-failed-attempts=5
app.security.lockout.retry-delay-ms=500

# ============================================
# Production Environment - PostgreSQL ready config
# Dev still uses MySQL via application-dev.properties
# ============================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

# Schema-per-tenant (PostgreSQL) — switcher activated when TENANCY_SCHEMA_SWITCHER=postgresql
app.multi-tenancy.enabled=true
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
app.tenancy.schema-switcher=${TENANCY_SCHEMA_SWITCHER:postgresql}
app.tenancy.platform-schema=${TENANCY_PLATFORM_SCHEMA:public}

spring.sql.init.mode=never

# Flyway — required in production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

logging.level.root=WARN
logging.level.com.thinkerscave=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION:86400000}

app.auth.refresh-cookie.enabled=${REFRESH_COOKIE_ENABLED:true}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:None}
app.auth.refresh-cookie.domain=${REFRESH_COOKIE_DOMAIN:.thinkerscave.com}
app.cors.allowed-origins=${ALLOWED_ORIGINS}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

server.error.include-message=never
server.error.include-stacktrace=never

# Disable OpenAPI UI in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# JUnit override for profile "test" — keeps unit tests on H2 (does not use remote server).
# src/test takes precedence over src/main when running tests.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS "public"
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

spring.flyway.enabled=false
app.multi-tenancy.enabled=false

jwt.secret=test_secret_key_minimum_256_bits_for_HS256_algorithm_unittest_only
jwt.expiration=3600000
refresh.token.expiration=86400000

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=testpassword
management.health.mail.enabled=false

server.port=8182
app.cors.allowed-origins=*
logging.level.root=WARN
logging.level.com.thinkerscave=INFO
